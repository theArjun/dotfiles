onboarding = false

# ─────────────────────────────────────────────────────────────────────────────
# Theme — Catppuccin Mocha, the same palette as Ghostty, Alacritty and tmux.
#
# "catppuccin" is already herdr's default, but it is named here so the choice
# survives a change of default. Everything under [theme.custom] layers on top
# of it and stays inside the Mocha palette:
#
#   crust #11111b  mantle #181825  base #1e1e2e
#   surface0 #313244  surface1 #45475a  surface2 #585b70
#   overlay0 #6c7086  subtext0 #a6adc8  text #cdd6f4
#   mauve #cba6f7  blue #89b4fa  teal #94e2d5  green #a6e3a1
#   yellow #f9e2af  peach #fab387  red #f38ba8
# ─────────────────────────────────────────────────────────────────────────────

[theme]
name = "catppuccin"

[theme.custom]
# Sidebar on mantle, panes on base. Two planes instead of one flat wall, and
# the divider between them stops depending on a border character.
sidebar_bg = "#181825"

# Two distinct shades so "the space I am in" and "the row the cursor is on"
# never read as the same thing in Navigate mode.
active_row_bg = "#313244"      # active Space / focused Agent
selection_bg = "#45475a"       # Navigate-mode cursor row

# Built-in catppuccin sets surface_dim to #1e1e2e, the same value as panel_bg,
# so separators and scrollbar tracks are painted in the background colour and
# disappear. surface1 keeps them subtle but visible.
surface_dim = "#45475a"

# ─────────────────────────────────────────────────────────────────────────────
# UI
# ─────────────────────────────────────────────────────────────────────────────

[ui]
# herdr defaults to the literal ANSI "cyan", which is whatever the host
# terminal decides. Pinning mauve keeps highlights, borders and the mode bars
# on-palette everywhere. Swap for blue "#89b4fa" or teal "#94e2d5" to taste.
accent = "#cba6f7"

pane_borders = "always"                     # frame a lone pane too, not just splits
show_agent_labels_on_pane_borders = true    # name the agent in the split border
status_indicators = "symbols"               # glyphs, not colour-only dots

# Float blocked and needs-input agents to the top of the Agent panel instead of
# grouping them by Space. With several worktrees in flight, the question you
# have to answer is always the first row.
agent_panel_sort = "priority"

# tmux-style status area at the right edge of the tab row.
tab_bar_right = [
  { type = "zoom" },
  { type = "datetime", format = "%a %d %b  %H:%M" },
]
tab_bar_right_separator = " · "

# Optional, uncomment to taste:
# hide_tab_bar_when_single_tab = true  # reclaim a row when a workspace has one tab
# sidebar_start_collapsed = false
# tab_bar_position = "bottom"          # tmux puts its status line at the bottom

# Agent notifications are off by default, which is the wrong default when the
# agents run in workspaces you are not looking at. "terminal" hands the popup to
# Ghostty, so it reaches the macOS notification centre and still works when
# herdr is attached over SSH. Switch to "system" after `brew install
# terminal-notifier` if you want clicking the notification to raise the terminal.
[ui.toast]
delivery = "terminal"
delay_seconds = 3          # only notify if the agent is still in that state

# Sidebar rows. Both default to an unstyled two-line layout; bolding the name
# and dimming the git line gives each entry a clear first and second rank.
[ui.sidebar.spaces]
row_gap = 1                # one blank row between worktree groups
rows = [
  ["state_icon", { token = "workspace", bold = true }],
  [{ token = "branch", fg = "#a6adc8" }, "git_status"],
]

[ui.sidebar.agents]
rows = [
  ["state_icon", { token = "workspace", bold = true }, "tab"],
  [{ token = "agent", fg = "#cba6f7" }, "state_text"],
]
row_gap = 1 # herdr-agent-quota

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "workspace", bold = true }, "tab"], [{ token = "agent", fg = "#cba6f7" }, "state_text"], [{ token = "$quota_provider_model", fg = "#e88461", bold = true, dim = false }], [{ token = "$quota_topic", bold = false, dim = false }], [{ token = "$quota_cache", bold = false, dim = false }, { token = "$quota_cache_ttl", bold = false, dim = false }, { token = "$quota_cache_state", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_error", fg = "#e4b957", bold = false, dim = false }], [{ token = "$quota_context", bold = false, dim = false }, { token = "$quota_week_inline_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_week_inline_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_week_inline_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_week_inline_unknown", bold = false, dim = false }], [{ token = "$quota_5h_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_5h_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_5h_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_5h_unknown", bold = false, dim = false }, { token = "$quota_week_normal", fg = "#82d978", bold = false, dim = false }, { token = "$quota_week_warning", fg = "#e4b957", bold = false, dim = false }, { token = "$quota_week_danger", fg = "#f16f7e", bold = false, dim = false }, { token = "$quota_week_unknown", bold = false, dim = false }]] # herdr-agent-quota-provider

# state_text spells out blocked / working / done / idle / unknown, and carries
# the agent's own reported label when it sends one. Without it the row leans
# entirely on state_icon, which is the one place a single glyph struggles: done
# and idle both mean "ready for input" and differ only in whether this client
# has already shown you the completion. No fg override here on purpose --
# herdr colours state_text semantically, and those colours already come from
# the Catppuccin tokens above.

# ─────────────────────────────────────────────────────────────────────────────
# Worktrees
#
# herdr checks out <directory>/<repo>/<branch-slug> and opens each checkout as a
# workspace grouped under the repo it came from. Deliberately not under
# ~/workspace: herdr_sessionizer.sh fuzzy-finds every directory two levels deep
# there, and worktree checkouts would flood that list. ~/worktrees keeps them
# visible in Finder and reachable by cd without touching the project picker.
# ─────────────────────────────────────────────────────────────────────────────

[worktrees]
directory = "~/worktrees"

[session]
# Already the default. Pinned because it is what makes a restart survivable when
# several agents are mid-conversation across worktrees.
resume_agents_on_restore = true

# ─────────────────────────────────────────────────────────────────────────────
# Keybindings — a port of tmux.conf, plus the agent and worktree actions
#
# Every binding that has a tmux counterpart uses the key tmux uses, either from
# tmux.conf in this repo or from tmux's own defaults. Herdr actions that tmux
# has no concept of are disabled ("") so there is nothing extra to learn; each
# one keeps its herdr default in a comment right above it, one uncomment away.
#
# The exceptions are the actions this config exists for: worktrees and agents.
# Those are bound, on keys tmux leaves free, and marked "herdr-only" below.
#
# Vocabulary: tmux session = herdr workspace, tmux window = herdr tab.
#
# tmux bindings with no herdr equivalent, left unmapped:
#   prefix+Space  next-layout          herdr has no layout presets
#   prefix+m      synchronize-panes    herdr has no input broadcast
#   prefix+R      move-window -r       herdr renumbers tabs itself
# prefix+Enter (tmux last-window) has no herdr equivalent either, so it is
# reused below for "jump to the agent that is asking for something".
# ─────────────────────────────────────────────────────────────────────────────

[keys]
prefix = "ctrl+space"                  # tmux: set -g prefix C-Space

# — Session / server ————————————————————————————————————————————————
help = "prefix+?"                      # tmux: ? list-keys
detach = "prefix+d"                    # tmux: d detach-client
reload_config = "prefix+r"             # tmux: r source-file ~/.tmux.conf
# herdr-only, default "prefix+s":
settings = ""
# herdr-only, default "prefix+o" — prefix+o is cycle-pane, so this takes
# prefix+Enter, the slot tmux spends on last-window. Focuses whichever agent
# raised the notification you can see: the one key worth reaching for when a
# background worktree goes quiet.
open_notification_target = "prefix+enter"

# — Workspaces (tmux sessions) ——————————————————————————————————————
workspace_picker = "prefix+s"          # tmux: s choose-tree -Zs
goto = "prefix+w"                      # tmux: w choose-tree -Zw
rename_workspace = "prefix+shift+s"    # tmux: S rename-session
previous_workspace = "prefix+("        # tmux: ( switch-client -p
next_workspace = "prefix+)"            # tmux: ) switch-client -n
# herdr-only, defaults "prefix+shift+n" / "prefix+shift+d":
# (prefix+t below fuzzy-finds a project and creates the workspace instead)
new_workspace = ""
close_workspace = ""
switch_workspace = ""
# herdr-only worktree helpers. Each opens the checkout as a workspace grouped
# under the repo it came from; see [worktrees] above for where they land.
# Shifted neighbours of the git popups: prefix+g is lazygit, prefix+b is the
# fzf branch switcher, and prefix+x closes a pane.
new_worktree = "prefix+shift+g"        # branch name prompt, creates it if new
open_worktree = "prefix+shift+b"       # list this repo's existing checkouts
remove_worktree = "prefix+shift+x"     # git worktree remove, asks first

# herdr-only agent navigation. prefix+f/F walk the Agent panel in priority
# order, so repeated prefix+f is a round of every agent that wants attention;
# prefix+shift+1..9 jumps straight to one by its position in that panel.
previous_agent = "prefix+shift+f"
next_agent = "prefix+f"
focus_agent = "prefix+shift+1..9"

# — Tabs (tmux windows) —————————————————————————————————————————————
new_tab = "prefix+c"                   # tmux: c new-window
rename_tab = "prefix+comma"            # tmux: , rename-window
close_tab = "prefix+&"                 # tmux: & kill-window
previous_tab = "prefix+p"              # tmux: p previous-window
next_tab = "prefix+n"                  # tmux: n next-window
switch_tab = "prefix+1..9"             # tmux: 1-9 select-window
move_tab_previous = ""
move_tab_next = ""

# — Panes ———————————————————————————————————————————————————————————
# tmux: C-h/j/k/l select-pane (vim-tmux-navigator, no prefix).
# These are prefix-free, so herdr swallows them everywhere -- unlike tmux it
# cannot hand them to a focused vim. Swap to prefix+h/j/k/l here (and move
# resize_pane_* below elsewhere) if a pane app needs ctrl+h/j/k/l back.
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
# tmux: h/j/k/l resize-pane
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"
split_vertical = "prefix+|"            # tmux: | split-window -h
split_horizontal = "prefix+minus"      # tmux: - split-window -v
close_pane = "prefix+x"                # tmux: x kill-pane
zoom = "prefix+z"                      # tmux: z resize-pane -Z
last_pane = ["prefix+tab", "prefix+;"] # tmux: Tab last-pane, ; last-pane
cycle_pane_next = "prefix+o"           # tmux: o select-pane -t :.+
cycle_pane_previous = ""
# herdr-only, default "prefix+r" — prefix+r is reload, resize is on h/j/k/l:
resize_mode = ""
# herdr-only, default "prefix+shift+p" — prefix+P runs the PR popup below:
rename_pane = ""
# herdr-only, default "prefix+e":
edit_scrollback = ""
# herdr-only, default "prefix+b" — prefix+b runs the branch popup below, so the
# sidebar (workspaces + agents) toggles on prefix+a instead. No tmux equivalent.
toggle_sidebar = "prefix+a"

# — Popups ——————————————————————————————————————————————————————————
# tmux: g display-popup lazygit
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "sh -c 'cd \"$HERDR_ACTIVE_PANE_CWD\" 2>/dev/null; exec lazygit'"
width = "80%"
height = "80%"

# tmux: b display-popup br (git branch switcher)
[[keys.command]]
key = "prefix+b"
type = "popup"
command = "zsh -c 'cd \"$HERDR_ACTIVE_PANE_CWD\" 2>/dev/null; source $HOME/.zsh_functions.zsh; br'"
width = "60%"
height = "50%"

# tmux: P display-popup pr (PR list/checkout)
[[keys.command]]
key = "prefix+shift+p"
type = "popup"
command = "zsh -c 'cd \"$HERDR_ACTIVE_PANE_CWD\" 2>/dev/null; source $HOME/.zsh_functions.zsh; pr'"
width = "80%"
height = "80%"

# tmux: I display-popup ghi (issue list + branch creation)
[[keys.command]]
key = "prefix+shift+i"
type = "popup"
command = "zsh -c 'cd \"$HERDR_ACTIVE_PANE_CWD\" 2>/dev/null; source $HOME/.zsh_functions.zsh; ghi'"
width = "80%"
height = "80%"

# tmux: t display-popup tmux_sessionizer.sh — same fuzzy project switcher,
# creating/focusing a herdr workspace instead of a tmux session.
[[keys.command]]
key = "prefix+t"
type = "popup"
command = "sh -c '$HOME/.config/arjun-dotfiles/scripts/herdr_sessionizer.sh'"
width = "80%"
height = "80%"

# tmux: H/J/K/L swap-pane
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = "sh -c '\"${HERDR_BIN_PATH:-herdr}\" pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction left'"

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = "sh -c '\"${HERDR_BIN_PATH:-herdr}\" pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction down'"

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = "sh -c '\"${HERDR_BIN_PATH:-herdr}\" pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction up'"

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = "sh -c '\"${HERDR_BIN_PATH:-herdr}\" pane swap --pane \"$HERDR_ACTIVE_PANE_ID\" --direction right'"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "open agent quota settings"
